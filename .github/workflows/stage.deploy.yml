name: Deploy to Azure VM
on:
  push:
    branches:
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: teamreliant
          password: Joshua1234

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: teamreliant/plaventi-organizer-service:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 20.115.86.176
          username: plaventi
          password: 'youCanNeverGuess!Right@vm'
          port: 22
          timeout: '60s'
          command_timeout: '5m'
          script: |
            sudo docker image pull teamreliant/plaventi-organizer-service:latest
            sudo docker stop plaventi-organizer-service || true
            sudo docker container prune -f || true
            sudo docker image prune -a -f || true
            sudo docker run -d --name plaventi-organizer-service -p 5001:5001 teamreliant/plaventi-organizer-service:latest
