name: Deploy to Azure VM
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: teamreliant
          password: Joshua1234

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: teamreliant/plavent-auth:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 40.67.241.162
          username: plaventi
          password: "Josh1.$ua1234567"
          port: 22
          timeout: '60s'
          command_timeout: '5m'
          script: |
            sudo docker image pull teamreliant/plavent-auth:latest
            sudo docker stop plaventi-auth || true
            sudo docker container rm plaventi-auth || true
            sudo docker run -d --name plaventi-auth -p 5000:5000 teamreliant/plavent-auth:latest
